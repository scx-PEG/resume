<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>个人简历 - 3D展示</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #0F172A 0%, #1E293B 100%);
            color: #F8FAFC;
            overflow-x: hidden;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        header {
            text-align: center;
            margin-bottom: 60px;
        }

        h1 {
            font-size: 3.5rem;
            font-weight: 700;
            margin-bottom: 10px;
            background: linear-gradient(135deg, #38BDF8 0%, #22D3EE 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .subtitle {
            font-size: 1.2rem;
            color: #94A3B8;
        }

        .main-content {
            display: grid;
            grid-template-columns: 400px 1fr;
            gap: 40px;
            margin-bottom: 60px;
        }

        .model-container {
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(148, 163, 184, 0.2);
            border-radius: 16px;
            padding: 20px;
            height: 500px;
            position: relative;
            overflow: hidden;
        }

        #canvas-container {
            width: 100%;
            height: 100%;
            position: relative;
        }

        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            color: #38BDF8;
            font-size: 1.2rem;
        }

        .info-section {
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(148, 163, 184, 0.2);
            border-radius: 16px;
            padding: 30px;
        }

        .info-section h2 {
            font-size: 1.8rem;
            margin-bottom: 20px;
            color: #38BDF8;
            border-bottom: 2px solid rgba(56, 189, 248, 0.3);
            padding-bottom: 10px;
        }

        .info-item {
            margin-bottom: 15px;
            line-height: 1.8;
        }

        .info-item strong {
            color: #22D3EE;
            display: inline-block;
            min-width: 100px;
        }

        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-top: 40px;
        }

        .gallery-item {
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(148, 163, 184, 0.2);
            border-radius: 12px;
            overflow: hidden;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .gallery-item:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(56, 189, 248, 0.2);
        }

        .gallery-item img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            display: block;
        }

        @media (max-width: 768px) {
            .main-content {
                grid-template-columns: 1fr;
            }

            h1 {
                font-size: 2.5rem;
            }

            .model-container {
                height: 400px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>个人简历</h1>
            <p class="subtitle">3D 互动展示</p>
        </header>

        <div class="main-content">
            <div class="model-container">
                <div id="canvas-container"></div>
                <div id="loading">加载 3D 模型中...</div>
            </div>

            <div class="info-section">
                <h2>基本信息</h2>
                <div class="info-item"><strong>姓名：</strong>张三</div>
                <div class="info-item"><strong>职位：</strong>前端工程师</div>
                <div class="info-item"><strong>邮箱：</strong>example@email.com</div>
                <div class="info-item"><strong>电话：</strong>138-0000-0000</div>
                
                <h2 style="margin-top: 30px;">技能专长</h2>
                <div class="info-item">• HTML / CSS / JavaScript</div>
                <div class="info-item">• React / Vue.js</div>
                <div class="info-item">• Three.js / WebGL</div>
                <div class="info-item">• Node.js / Express</div>
            </div>
        </div>

        <div class="gallery">
            <div class="gallery-item"><img src="1.jpg" alt="作品1"></div>
            <div class="gallery-item"><img src="2.jpg" alt="作品2"></div>
            <div class="gallery-item"><img src="3.jpg" alt="作品3"></div>
            <div class="gallery-item"><img src="4.png" alt="作品4"></div>
            <div class="gallery-item"><img src="5.jpg" alt="作品5"></div>
            <div class="gallery-item"><img src="6.jpg" alt="作品6"></div>
        </div>
    </div>

    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
        }
    }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { MeshoptDecoder } from 'three/addons/libs/meshopt_decoder.module.js';

        const container = document.getElementById('canvas-container');
        const loading = document.getElementById('loading');

        // 创建场景
        const scene = new THREE.Scene();
        scene.background = null;

        // 创建相机
        const camera = new THREE.PerspectiveCamera(
            50,
            container.clientWidth / container.clientHeight,
            0.1,
            1000
        );
        camera.position.set(0, 1, 3);

        // 创建渲染器
        const renderer = new THREE.WebGLRenderer({ 
            antialias: true,
            alpha: true
        });
        renderer.setSize(container.clientWidth, container.clientHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.outputColorSpace = THREE.SRGBColorSpace;
        container.appendChild(renderer.domElement);

        // 添加灯光
        const ambientLight = new THREE.AmbientLight(0xffffff, 1);
        scene.add(ambientLight);

        const directionalLight = new THREE.DirectionalLight(0xffffff, 2);
        directionalLight.position.set(5, 10, 5);
        scene.add(directionalLight);

        const fillLight = new THREE.DirectionalLight(0x38BDF8, 1);
        fillLight.position.set(-5, 0, -5);
        scene.add(fillLight);

        // 添加控制器
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.minDistance = 1;
        controls.maxDistance = 10;
        controls.target.set(0, 0.8, 0);
        controls.update();

        // 加载 GLB 模型（支持 Meshopt 压缩）
        const loader = new GLTFLoader();
        
        // 🔥 关键：设置 Meshopt 解码器
        loader.setMeshoptDecoder(MeshoptDecoder);

        loader.load(
            'avatar.glb',
            function (gltf) {
                const model = gltf.scene;
                
                // 调整模型位置和大小
                const box = new THREE.Box3().setFromObject(model);
                const center = box.getCenter(new THREE.Vector3());
                const size = box.getSize(new THREE.Vector3());
                
                const maxDim = Math.max(size.x, size.y, size.z);
                const scale = 2 / maxDim;
                model.scale.multiplyScalar(scale);
                
                model.position.x = -center.x * scale;
                model.position.y = -box.min.y * scale;
                model.position.z = -center.z * scale;
                
                scene.add(model);
                loading.style.display = 'none';
                
                console.log('✅ 3D 模型加载成功！');
            },
            function (xhr) {
                const percent = (xhr.loaded / xhr.total * 100).toFixed(0);
                loading.textContent = `加载中... ${percent}%`;
            },
            function (error) {
                console.error('❌ 模型加载失败:', error);
                loading.textContent = '模型加载失败';
                loading.style.color = '#F97316';
            }
        );

        // 动画循环
        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
        animate();

        // 响应式调整
        window.addEventListener('resize', function() {
            camera.aspect = container.clientWidth / container.clientHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(container.clientWidth, container.clientHeight);
        });
    </script>
</body>
</html>
